# A downloadable build, from a version tag.
#
# What this produces
# ------------------
# A signed, notarised, stapled disk image attached to a GitHub release, with a SHA-256
# beside it and release notes taken straight out of `CHANGELOG.md`. Nothing about the
# release is written twice: the notes come from the changelog, the version comes from
# `scripts/make-app.sh`, and the tag has to agree with both before anything is built.
#
# What it refuses to do
# ---------------------
# Ship an unsigned image. Gatekeeper refuses a downloaded app that has no Developer ID, and
# the person who tried reads that as a broken app rather than an unsigned one — you get one
# first impression. `make-dmg.sh --release` exits rather than produce one, so until the
# signing secrets exist this workflow fails at a named step instead of publishing something
# nobody can open.
#
# Secrets it needs, none of which exist yet
# -----------------------------------------
#   SIGNING_CERTIFICATE_P12   base64 of a Developer ID Application .p12
#   SIGNING_CERTIFICATE_PASS  its password
#   SIGNING_IDENTITY          "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY                base64 of the App Store Connect .p8 private key
#   NOTARY_KEY_ID             its key id
#   NOTARY_ISSUER             the issuer UUID
#
# An API key rather than a stored notarytool profile, because a runner has no keychain
# worth storing one in and a password would have to be typed by somebody.
#
# Secrets it uses if they exist, and shrugs off if they do not
# ------------------------------------------------------------
#   SELF_SIGN_P12_BASE64      base64 of the `Replay Self-Signed` .p12   — docs/SIGNING.md
#   SELF_SIGN_P12_PASSWORD    its password
#   HOMEBREW_TAP_TOKEN        a token that can push to nurkamol/homebrew-tap
#
# The first two keep every unsigned release carrying the *same* identity, which is what lets
# Homebrew hand a reader's Gatekeeper approval forward instead of prompting again on every
# update. The third bumps the cask automatically, so its checksum cannot go stale — which it
# did once, by hand, between 0.9.7 and 0.9.8.

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      # Three places name the version — the tag, `make-app.sh`, and the newest changelog
      # entry — and a release where they disagree describes something other than what it
      # ships. Checked before anything is built, because the fix is a one-line edit and
      # finding out after a 40-minute notarisation would be miserable.
      - name: The tag, the build and the changelog agree
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          BUILD_VERSION="$(grep -m1 '^VERSION=' scripts/make-app.sh | cut -d'"' -f2)"
          if [ "$VERSION" != "$BUILD_VERSION" ]; then
            echo "::error::tag says $VERSION, scripts/make-app.sh says $BUILD_VERSION"
            exit 1
          fi
          node tools/release-notes.mjs "$VERSION" --check
          # …and the two places that check does not reach: the version compiled into the
          # binary, and the in-app release history.
          node tools/version-audit.mjs

      # The same checks `parity.yml` runs. A release is the one build where "we ran the
      # tests on the branch" is not good enough — this is the artefact, so it is checked.
      - name: No view spells a number
        run: node tools/design-audit.mjs

      - name: The shortcut table matches what is bound
        run: node tools/shortcut-audit.mjs

      - name: Build
        run: swift build

      - name: The CLI's exit codes, streams and JSON shape
        run: ./tools/cli-audit.sh

      - name: The contract
        run: swift run replay-parity

      - name: Behaviour
        run: swift test

      # Signed or not, decided once and read by every step below.
      #
      # This used to stop the run dead without a certificate, which was right while the
      # alternative was publishing something nobody could open. It is not right any more:
      # a release is also a *version*, and a version is what Homebrew builds from and what
      # the in-app update check looks for. Both work from the source tarball GitHub attaches
      # to any release, neither needs a signature, and refusing to tag until a certificate
      # exists held those hostage to it.
      #
      # So a run without secrets publishes a zipped application and no disk image. The zip
      # is the deliberate choice: a `.dmg` is what a *finished* Mac app arrives in and would
      # promise something this cannot deliver, while a zip reads as "here is the build" and
      # is what unsigned projects on GitHub actually ship. Either way the person who
      # downloads it meets Gatekeeper, so the notes carry the way through — which is the
      # part most projects leave out, and the reason their issue trackers fill up with
      # "the app is damaged".
      - name: Can this run sign?
        env:
          CERT_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
        run: |
          if [ -n "$CERT_P12" ]; then
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "This release will carry a signed, notarised disk image."
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::No Developer ID. Publishing a source release with no disk image;"
            echo "::warning::install with Homebrew or from source. See the README."
          fi

      # A throwaway keychain, unlocked for this job and destroyed after it, so the
      # certificate never touches the runner's login keychain and cannot outlive the run.
      - name: Import the signing certificate
        if: env.SIGNED == '1'
        env:
          CERT_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERT_PASS: ${{ secrets.SIGNING_CERTIFICATE_PASS }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/replay-signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarise and staple
        if: env.SIGNED == '1'
        env:
          REPLAY_SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          REPLAY_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          REPLAY_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY }}
        run: |
          echo "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export REPLAY_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          ./scripts/make-dmg.sh --release
          rm -f "$RUNNER_TEMP/notary.p8"

      # Proves the result opens on a machine that has never seen it, which is the only
      # question this whole workflow exists to answer.
      - name: The image is stapled
        if: env.SIGNED == '1'
        run: |
          xcrun stapler validate "build/Replay-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature -vv \
            "build/Replay-$VERSION.dmg"

      # The middle tier: a certificate nobody trusts, but the *same* one every time.
      #
      # An ad-hoc signature's designated requirement is the code hash, so it changes with
      # every build, and macOS treats each release as a different program. Homebrew 6 reads
      # that requirement on upgrade and carries a reader's "Open Anyway" forward only when it
      # matches — so under ad-hoc signing every update prompted again, forever. The in-app
      # updater churned the identity the same way. docs/SIGNING.md has the whole argument and
      # the commands that produce these two secrets.
      #
      # Absent secrets are not an error: `make-app.sh` falls back to ad-hoc on its own.
      - name: Import the self-signed certificate
        if: env.SIGNED != '1'
        env:
          P12_BASE64: ${{ secrets.SELF_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SELF_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::No SELF_SIGN_P12_BASE64. This build will be ad-hoc signed, so"
            echo "::warning::everyone upgrading to it re-approves Replay in System Settings."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/replay-selfsign.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/selfsign.p12"
          security import "$RUNNER_TEMP/selfsign.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          # Without this codesign blocks on a keychain prompt no one is there to answer.
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepended to the search list so `security find-identity` in make-app.sh sees it.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/selfsign.p12"
          # No `-v`: it filters to certificates that chain to a trusted root, which a
          # self-signed one never does. With it this prints "0 valid identities found".
          security find-identity -p codesigning "$KEYCHAIN"

      # One text, written once, in CHANGELOG.md. An unsigned run prepends how to install,
      # because a release page with no download and no explanation reads as a mistake.
      # `ditto`, never `zip`. A `.app` is a directory of symlinks and extended attributes,
      # and `zip` flattens both — the bundle unpacks into something that will not launch.
      # `--keepParent` so it expands to `Replay.app` rather than scattering its contents
      # into whatever folder it was opened in.
      - name: Zip the application
        if: env.SIGNED != '1'
        env:
          P12_BASE64: ${{ secrets.SELF_SIGN_P12_BASE64 }}
        run: |
          ./scripts/make-app.sh release
          ditto -c -k --keepParent --sequesterRsrc \
            "build/Replay.app" "build/Replay-$VERSION.zip"
          shasum -a 256 "build/Replay-$VERSION.zip" > "build/Replay-$VERSION.zip.sha256"
          # It has to be signed, even if only ad-hoc: an unsigned bundle will not launch on
          # Apple silicon at all, which is a worse failure than the Gatekeeper prompt and
          # would look identical to the person who hit it.
          codesign --verify --deep --strict "build/Replay.app"

          # Which identity actually landed. `make-app.sh` chooses silently between three, and
          # the difference is invisible in the artefact but decides whether every reader
          # re-approves this build in System Settings — so it is asserted, not assumed.
          codesign -d -r- "build/Replay.app" 2>&1 | tee "$RUNNER_TEMP/requirement.txt"
          if [ -n "$P12_BASE64" ] && grep -q "designated => cdhash" "$RUNNER_TEMP/requirement.txt"; then
            echo "::error::The certificate was imported but the app came out ad-hoc anyway."
            echo "::error::Its identity would change again, and every upgrade would prompt."
            exit 1
          fi

      # Does the thing we are about to publish actually open?
      #
      # 0.9.1 shipped an app that died on launch. It built, 951 contract checks passed, 115
      # behaviour cases passed, every audit passed, and the zip was unopenable — because the
      # resource bundle SwiftPM's native builder produces is shaped differently from the one
      # Xcode produces, `Bundle.module` traps rather than returning nil, and no test ever runs
      # where the bundle is absent. The only way to catch that class of failure is to run the
      # assembled artefact.
      - name: The assembled app opens
        run: |
          BIN="build/Replay.app/Contents/MacOS/Replay"
          "$BIN" >/tmp/smoke.log 2>&1 &
          PID=$!
          sleep 12
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            echo "the app was still running after 12 seconds"
          else
            echo "::error::the assembled app exited on its own — it does not open."
            echo "--- its output ---"; cat /tmp/smoke.log || true
            exit 1
          fi

      - name: Release notes, from the changelog
        run: |
          if [ "$SIGNED" != "1" ]; then
            cat > "$RUNNER_TEMP/notes.md" <<PREAMBLE
          ## Install

          **Homebrew is the recommended way**, and the only one with nothing to click
          through — the tap clears the quarantine flag on install and on every upgrade:

          \`\`\`sh
          brew trust --tap nurkamol/tap
          brew install --cask nurkamol/tap/replay-app
          \`\`\`

          \`brew trust\` is required by Homebrew 6 before it will load any third-party tap.
          Skipping it looks like a broken tap rather than a consent prompt.

          Also in the tap: \`nurkamol/tap/replay\` (the command-line reader) and
          \`nurkamol/tap/replay-app-source\`, which compiles on your Mac and needs a full Xcode.

          ### Or the zip

          **[Replay-$VERSION.zip](https://github.com/nurkamol/replay-swift/releases/download/v$VERSION/Replay-$VERSION.zip)** — unzip it and drag \`Replay.app\` to Applications.

          **macOS will refuse to open this one the first time.** Replay has no Apple Developer
          ID yet, so a downloaded copy shows **"Apple could not verify Replay is free of
          malware"**, offering only *Move to Trash* or *Cancel*. That message is about a
          **missing certificate, not about anything found in the app**.

          To open it:

          1. Try to open Replay once and dismiss the warning.
          2. Go to **System Settings ▸ Privacy & Security**, scroll down, click **Open Anyway**.
          3. Confirm. It opens normally from then on.

          Or one line in a terminal, which does the same thing:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Replay.app
          \`\`\`

          **Right-click ▸ Open does not work.** That bypass existed for years and Apple
          removed it in macOS 15. It is still the advice in most projects' READMEs.

          A signed, notarised disk image — no warnings on any route — appears here the day
          there is a certificate. The workflow that builds it is already written.

          ---

          PREAMBLE
          fi
          node tools/release-notes.mjs "$VERSION" >> "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          name: Replay ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            build/Replay-${{ env.VERSION }}.dmg
            build/Replay-${{ env.VERSION }}.dmg.sha256
            build/Replay-${{ env.VERSION }}.zip
            build/Replay-${{ env.VERSION }}.zip.sha256
          # Off, because an unsigned run has no image to attach and the release is still
          # worth publishing. The signed path is protected by the stapler check above, which
          # fails before this step if the image is missing or unnotarised.
          fail_on_unmatched_files: false

      # Publish the cask: this repository's copy is the source, the tap is a mirror.
      #
      # Two problems, one step. The version and checksum used to be typed into the tap by hand
      # after the release existed — two numbers copied between two repositories by a person,
      # and 0.9.8 duly shipped for a while carrying 0.9.7's sha256 against a 0.9.8 URL, so
      # every install failed on a checksum mismatch that reads as a corrupted download rather
      # than a mistake in the tap. And the rest of the file was copied across by hand too, so
      # a `postflight` or an `uninstall quit:` added here reached nobody until somebody
      # remembered to paste it.
      #
      # So the whole file goes, and only then are the two generated lines substituted. Nothing
      # can drift: the sha is computed from the artefact uploaded by this same job. Without the
      # token it warns and skips — a missing secret should not fail a release that is
      # otherwise finished — and the tap is updated by hand as before.
      - name: Publish the Homebrew cask
        if: env.SIGNED != '1'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN — the tap still describes the previous"
            echo "::warning::release. Copy Casks/replay-app.rb into nurkamol/homebrew-tap by"
            echo "::warning::hand and set its version and sha256 from Replay-$VERSION.zip.sha256."
            exit 0
          fi
          SHA="$(shasum -a 256 "build/Replay-$VERSION.zip" | awk '{print $1}')"
          echo "Replay-$VERSION.zip is $SHA"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/nurkamol/homebrew-tap.git" "$RUNNER_TEMP/tap"
          CASK="$RUNNER_TEMP/tap/Casks/replay-app.rb"
          cp Casks/replay-app.rb "$CASK"
          sed -i '' -E "s|^  version \".*\"|  version \"$VERSION\"|" "$CASK"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" "$CASK"
          # Both substitutions have to have landed. A `sed` that matched nothing is silent,
          # and a silently-unbumped cask is the exact failure this step exists to prevent.
          grep -q "^  version \"$VERSION\"$" "$CASK" || { echo "::error::version did not take"; exit 1; }
          grep -q "^  sha256 \"$SHA\"$" "$CASK" || { echo "::error::sha256 did not take"; exit 1; }
          # It has to be loadable Ruby, checked before it can break `brew install` for everyone.
          ruby -c "$CASK"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/replay-app.rb
          if git diff --cached --quiet; then
            echo "The tap already matches this release."
          else
            git commit -m "replay-app $VERSION"
            git push
          fi

      - name: Destroy the signing keychain
        if: always() && env.SIGNED == '1'
        run: security delete-keychain "$RUNNER_TEMP/replay-signing.keychain-db" || true

      - name: Destroy the self-signing keychain
        if: always() && env.SIGNED != '1'
        run: security delete-keychain "$RUNNER_TEMP/replay-selfsign.keychain-db" || true
