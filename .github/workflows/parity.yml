# The parity suite, on every push and pull request.
#
# What this can and cannot check
# ------------------------------
# It runs the committed `spec/` against the Swift port. It does **not** regenerate
# `spec/` — `tools/sync-spec.mjs` reads the Glaze app's sources, which live in a
# private container on a developer's Mac and are not in this repository. So CI
# answers "does the port still match the contract?" and never "is the contract
# still current?". That second question is what `node tools/port-queue.mjs`
# answers, at a desk, with the reference app present.
#
# `swift run replay-parity` is the authoritative check for the *contract*: it needs
# no Xcode selection and no test framework, which is exactly why the suite was built
# to run that way. `swift test` runs those same checks through swift-testing and,
# since it can reach the app target, the model behaviour suite as well — loading,
# range filtering, caching and deletion, which the contract says nothing about.
# That half needs a real toolchain and a macOS as new as the app's deployment
# target, which is why this job is pinned rather than run on whatever is current.

name: parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version
          xcrun --show-sdk-version

      # A half-committed regeneration is easy to miss by eye: a new scenario file
      # without its index entry, or an index entry whose file never got added.
      # The suite would silently skip the first and throw on the second.
      - name: Fixture index matches the fixture files
        run: |
          listed=$(python3 -c "import json;print('\n'.join(sorted(json.load(open('spec/fixtures/index.json'))['fixtures'])))")
          present=$(ls spec/fixtures/*.json | xargs -n1 basename | sed 's/\.json$//' | grep -v '^index$' | sort)
          if [ "$listed" != "$present" ]; then
            echo "spec/fixtures/index.json disagrees with the files on disk."
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi
          echo "$(echo "$listed" | wc -l | tr -d ' ') fixtures, all indexed"

      # A design system only holds if nothing bypasses it. One view with a literal
      # padding in it is not a bug anyone reports — it is how "change a token to
      # change the app" quietly stops being true.
      - name: No view spells a number
        run: node tools/design-audit.mjs

      # The keyboard is the one surface that cannot show you what it can do. A shortcut
      # bound in a view and written down nowhere works and is undiscoverable; one written
      # down and never bound is a table that lies to whoever reads it.
      - name: The shortcut table matches what is bound
        run: node tools/shortcut-audit.mjs

      # A symbol newer than the deployment target draws *nothing* — no crash, no warning,
      # just a gap where an icon should be, on a Mac the developer does not have. The floor
      # is macOS 14 and the work happens on 27, so this is the exact shape of bug that ships.
      # Read from macOS's own manifest rather than a hand-kept list.
      - name: Every SF Symbol exists on the oldest macOS supported
        run: node tools/symbol-audit.mjs

      # A ratchet, not a gate: it reports how many strings a translator still cannot reach,
      # and fails only when a file that *had* been localised grows a hard-coded one. That is
      # the failure that decays silently — nothing else notices until somebody reads the app
      # in another language and finds one English line in the middle of a paragraph.
      - name: Localised files stay localised
        run: node tools/strings-audit.mjs

      # The version is written in four places and nothing compared them. One of the four is
      # what the update check compares against, so a stale value there offers an update to
      # the version already running — which shipped, and which every other check passed.
      - name: The version agrees with itself
        run: node tools/version-audit.mjs

      - name: Build
        run: swift build

      # A CLI's contract is not its sentences. Exit codes, which stream the output goes to,
      # and the shape of `--json` can each break while every line still reads correctly by
      # eye — and each one breaks somebody's script rather than somebody's screen. The
      # runner has no recorded history, so this checks argument handling only; the
      # data-reading half runs on a machine that has some.
      - name: The CLI's exit codes, streams and JSON shape
        run: ./tools/cli-audit.sh

      # Session titles are named after the *local* day part, so the suite is only
      # meaningful if it passes away from the timezone its fixtures were generated
      # in. It did not, once — see docs/FINDINGS.md — and this is the guard.
      - name: Parity suite, across timezones
        run: |
          status=0
          for zone in UTC America/New_York Asia/Tokyo Australia/Lord_Howe; do
            echo "── $zone ─────────────────────────────────────────"
            TZ="$zone" swift run replay-parity || status=1
          done
          exit $status

      - name: Parity and model behaviour through swift-testing
        run: swift test
